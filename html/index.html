<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Contact Manager</title>
    </head>

  <body>
    <div class="contacts-screen login-screen">
        <div id="login-section">

            <h1>Contact Manager</h1>
            <p class="login-subtitle">
                Login to manage your contacts
            </p>

            <form id="login-form">
                <div class="input-wrap">
                    <span>👤</span>
                    <input class="text-input" id="login-username" placeholder="Username" type="text" autocomplete="username">
                </div>
                <div class="input-wrap">
                    <span>🔒</span>
                    <input class="text-input" id="login-password" placeholder="Password" type="password" autocomplete="current-password">
                </div>
                <p id="login-error" class="error-message"></p>
                <button class="contact-bttn" type="submit">
                    Login
                </button>
            </form>

            <p class="account-text">
                Don't have an account?
                <a href="#" id="register-link">Register</a>
            </p>
        </div>

        <div id="register-section" style="display: none;">

            <h1>Create Account</h1>
            <p class="login-subtitle">
                Create an account to manage your contacts
            </p>

            <form id="register-form">
                <div class="input-wrap">
                    <span>👤</span>
                    <input class="text-input" id="register-firstname" placeholder="First Name" type="text" autocomplete="given-name">
                </div>
                <div class="input-wrap">
                    <span>👤</span>
                    <input class="text-input" id="register-lastname" placeholder="Last Name" type="text" autocomplete="family-name">
                </div>
                <div class="input-wrap">
                    <span>📧</span>
                    <input class="text-input" id="register-username" placeholder="Username" type="text" autocomplete="username">
                </div>
                <div class="input-wrap">
                    <span>🔒</span>
                    <input class="text-input" id="register-password" placeholder="Password" type="password" autocomplete="new-password">
                </div>
                <p id="register-error" class="error-message"></p>
                <p id="register-success" class="success-message"></p>

                <button class="contact-bttn" type="submit">
                    Register
                </button>
            </form>

            <p class="account-text">
                Already have an account?
                <a href="#" id="back-to-login">Login</a>
            </p>
        </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>

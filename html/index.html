<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ It's live guys ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0e14;
      font-family: "Georgia", serif;
      text-align: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 800px;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      border-radius: 4rem 2rem 4rem 2rem;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.2s;
    }

    .main-title {
      font-size: clamp(3.2rem, 15vw, 6.2rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #f2f5fa;
      text-shadow: 0 4px 20px rgba(255, 215, 100, 0.2);
      margin-bottom: 0.25rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .flash-sub {
      font-size: clamp(2.8rem, 12vw, 5.2rem);
      font-weight: 600;
      margin-top: 0.15rem;
      letter-spacing: 0.06em;
      transition: color 0.02s ease;
      text-shadow: 0 0 12px currentColor;
      color: #d43f3f;
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(0px);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="main-title">
      It's live guys!!!
    </div>
    <div id="flashy" class="flash-sub">
      :D
    </div>

  <script>
    (function() {
      const flashEl = document.getElementById('flashy');

      // red (#d43f3f) green (#2a9d4a)
      const RED = '#d43f3f';
      const GREEN = '#2a9d4a';

      // start with red
      let isRed = true;
      flashEl.style.color = RED;
      flashEl.style.textShadow = `0 0 18px ${RED}`;

      // toggle every 13ms
      const intervalId = setInterval(() => {
        if (isRed) {
          flashEl.style.color = GREEN;
          flashEl.style.textShadow = `0 0 22px ${GREEN}`;
        } else {
          flashEl.style.color = RED;
          flashEl.style.textShadow = `0 0 22px ${RED}`;
        }
        isRed = !isRed;
      }, 13);
    })();
  </script>
</body>
</html>

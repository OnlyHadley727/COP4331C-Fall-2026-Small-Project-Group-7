<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css"/>
        <title>New Contact</title>
    </head>
    <body>
        <div class="contacts-screen">
            <h1>Add Contact</h1>
            <form class="contact-form" id="new-contact">
                <div class="input-wrap">
                    <input class="text-input" id="first-name" placeholder="First name"/>
                </div>
                <div class="input-wrap">
                    <input class="text-input" id="last-name" placeholder="Last name"/>
                </div>
                <div class="input-wrap">
                    <span>📞</span>
                    <input class="text-input" id="phone-number" placeholder="Phone Number" type="tel"/>
                </div>
                <div class="input-wrap">
                    <span>✉️</span>
                    <input class="text-input" id="email" placeholder="Email" type="email"/>
                </div>
                <p id="error"></p>
                <button class="contact-bttn" id="save" type="submit">Save</button>
            </form>
            <button class="contact-bttn" id="cancel">Cancel</button>
        </div>
    </body>
    <script src="js/contactForm.js"></script>
</html>
